version: 0.2.{build}
pull_requests:
  do_not_increment_build_number: true
clone_depth: 1
configuration: Release
image: Visual Studio 2022
platform: Win32
build_script:
  - msbuild DreeRally.sln /m /nologo /v:minimal /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"
artifacts:
  - path: Release/DreeRally.exe
    name: DreeRally.exe
environment:
  global:
    # WarningLevel of 1 is ONLY SEVERE warnings, nothing else. See
    # https://stackoverflow.com/questions/1023858/how-to-suppress-specific-msbuild-warning
    MSBUILD_FLAGS: /maxcpucount /nologo /property:WarningLevel=1
